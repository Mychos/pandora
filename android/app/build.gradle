plugins {
    id 'com.android.application'
}

// The app's one version. `versionCode` is the number Android compares before it
// takes a build as an update, so it is derived from this and never written by
// hand: 0.1.1 ships as 101, and the old APK is replaceable.
//
// shortcut: two digits per part, so 0.99.99 is the ceiling — widen the strides
// when a third digit is ever needed.
def appVersion = "0.0.0"
def digits = appVersion.tokenize('.').collect { it.toInteger() }
assert digits.size() == 3, "the app version must be MAJOR.MINOR.PATCH: $appVersion"
def appCode = digits[0] * 10000 + digits[1] * 100 + digits[2]
// Android refuses a versionCode of 0, so 0.0.0 — the first release — ships as 1.
// The name is what a user reads; this number only has to be larger than the last.
if (appCode == 0) {
    appCode = 1
}

// The key every released APK is signed with. It is a secret: `.gitignore` keeps
// it out of the repository and CI decodes it from one. A local build names it in
// `android/keystore.properties` (gitignored) or through the `PANDORA_*` variables;
// with neither, the release type below spends the debug key, so a machine with no
// keystore still installs over `adb`.
def keyProps = new Properties()
def keyPropsFile = rootProject.file("keystore.properties")
if (keyPropsFile.isFile()) {
    keyPropsFile.withInputStream { keyProps.load(it) }
}

// The environment wins, so CI says what to use and a stale properties file cannot.
def keyValue = { String fromEnv, String fromFile ->
    def value = System.getenv(fromEnv)?.trim()
    if (value) {
        return value
    }
    def stored = keyProps.getProperty(fromFile)?.trim()
    return stored ? stored : null
}

def signingPath = keyValue("PANDORA_KEYSTORE", "storeFile")
def signingFile = signingPath ? rootProject.file(signingPath) : null
if (signingFile != null && !signingFile.isFile()) {
    logger.warn("${signingPath} is not a file: this APK is signed with the debug key")
    signingFile = null
}
if (signingFile == null) {
    logger.warn("no keystore in android/keystore.properties or PANDORA_KEYSTORE: this APK is signed with the debug key and cannot replace a released install")
}
// Not `storePassword`/`keyAlias`: inside `signingConfigs` those name the DSL's own
// methods, and a local variable of the same name is the one that loses.
def keystorePassword = keyValue("PANDORA_KEYSTORE_PASSWORD", "storePassword")
def keystoreAlias = keyValue("PANDORA_KEY_ALIAS", "keyAlias") ?: "pandora"
def keystoreKeyPassword = keyValue("PANDORA_KEY_PASSWORD", "keyPassword") ?: keystorePassword

android {
    // The Java package the Rust side calls into (`dev/pandora/Pandora`),
    // so a rename here is a rename there.
    namespace "dev.pandora"
    compileSdk = 35

    defaultConfig {
        applicationId "dev.pandora"
        // 29 is Android 10: the oldest release the app is willing to claim, and
        // the one it was first tried on. Nothing here needs a version guard —
        // `androidx.biometric` covers the fingerprint from 28 up, and the
        // keystore key that demands user authentication exists from 24 on.
        // Older phones get the master password, which is the way in anyway.
        minSdk = 29
        targetSdk = 35
        versionCode appCode
        versionName appVersion
    }

    signingConfigs {
        if (signingFile != null) {
            release {
                storeFile signingFile
                // PKCS12, the only type `keytool` writes by default: it keeps
                // nothing in the key password, so both are the store's.
                storeType "pkcs12"
                storePassword keystorePassword
                keyAlias keystoreAlias
                keyPassword keystoreKeyPassword
            }
        }
    }

    androidResources {
        // The app's own text is Rust (`shared::i18n`, en/es with the key set a
        // test enforces); what Android sides are AndroidX's own strings, and
        // their translations are dozens of locales the app can never show.
        // Keeping en/es drops the rest of `values-*` from `resources.arsc`.
        localeFilters += ["en", "es"]
    }

    buildTypes {
        release {
            // The shipped APK. R8 is on, so the dex stops carrying every corner
            // of appcompat and the Kotlin stdlib that the app never reaches
            // (7.2 MB down to ~1 MB), and `shrinkResources` takes the resources
            // those classes were the only users of. `dev.pandora.Pandora`'s
            // methods are called from the native side, which R8 cannot see:
            // `proguard-rules.pro` is what keeps them.
            minifyEnabled = true
            shrinkResources = true
            // The release key when one was handed in — an APK signed with
            // another key is an APK no user can install over the last one. Locally
            // the debug key stands in, because an unsigned APK installs nowhere.
            signingConfig = signingConfigs.findByName("release") ?: signingConfigs.getByName("debug")
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled = false
        }
    }

    packaging {
        jniLibs {
            // Compress the `.so` in the APK instead of storing it: it deflates to
            // 42% of its size, and a 10 MB download beats a 25 MB one. The price
            // is that the installer copies it out on the device — a smaller
            // download, a slightly larger install.
            useLegacyPackaging = true
            // Cargo already strips (`strip = true`, and `llvm-nm` answers "no
            // symbols"): the NDK's strip only has nothing to do and gets to
            // warn "Unable to strip … packaging them as they are" on every
            // release build. Skipping it packages the same bytes and says so.
            keepDebugSymbols.add("**/libpandora.so")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // The launcher icons are generated straight into the repository's
            // asset tree by `scripts/build-logo.sh`, so they are not copied here.
            res.srcDirs = ['src/main/res', '../../assets/app/android']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // `canAuthenticate` and the prompt itself. The platform's `BiometricManager`
    // is not public API, and this also answers correctly on 28 and 29.
    implementation 'androidx.biometric:biometric:1.1.0'
    // The custom tab the GitHub sign-in opens in: the phone's own browser, so it
    // comes up already signed in, and not the GitHub app's own web view.
    implementation 'androidx.browser:browser:1.8.0'
    // GameActivity, which `android-activity` 0.6 expects. Its `prefab` C++ glue
    // must *not* be enabled: the crate brings its own.
    implementation 'androidx.games:games-activity:4.4.0'
}
