# The crate is the only thing this repository holds; the browser extension lives
# beside it and carries its own release steps.
#
# Three runners on purpose. Linux is where the suite and the lints run. Windows
# is the only place the named-pipe bridge in `src/bridge/socket.rs` is ever
# executed — it cannot be cross-compiled here (the C dependencies want a mingw
# toolchain), so without this job the Windows half rots. macOS only typechecks:
# the suite stays on Linux, but its target-specific windowing and idle branches
# still have to be seen by rustc.
name: check

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # `rust-toolchain.toml` pins the compiler every build uses; the actions below name
  # the same one so a job never installs two of them.
  TOOLCHAIN: "1.99.0"
  # The fuzzers build the whole crate under AddressSanitizer, and rustc compiling
  # `ttf-parser` with those flags segfaults when several of them run at once. Two jobs
  # is slow and reliable; the default is fast and not.
  CARGO_BUILD_JOBS: "2"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # `rust-toolchain.toml` names the compiler and its components; `rustup` reads it,
      # so no workflow repeats the version.
      - name: rust
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      # The audio preview links against ALSA, and the windowing backends look
      # their libraries up through pkg-config.
      - name: system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev
      - name: format
        run: cargo fmt --check
      - name: lints
        run: cargo clippy --all-targets -- -D warnings
      # `probe_rows` is a debug probe and is `#[ignore]`d, so this is the whole
      # suite and nothing has to be skipped.
      - name: tests
        run: cargo test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # `rustup` itself: this runner handed the toolchain action an empty `toolchain`
      # input whatever the workflow said, and the file names the compiler anyway.
      - name: rust
        shell: bash
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: typecheck every target
        run: cargo check --all-targets
      # The whole suite, not only the pipe: Windows is a shipped platform, and the
      # parsers, the box format and the matching rules are the same code there.
      - name: tests
        run: cargo test

  # macOS only compiles here: the suite and the lints run on Linux, but this
  # is where the target-specific windowing and idle branches are seen by rustc.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: rust
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: typecheck every target
        run: cargo check --all-targets

  # Nothing here reaches the network at runtime; this is about what the dependency
  # tree brings with it. A finding fails the job on purpose: the fix is a bump, or an
  # `audit.toml` entry that says why the advisory does not apply.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # The prebuilt binary: building `cargo-audit` itself wants cmake and a C
      # toolchain for `aws-lc-sys`, which is a minute of CI for nothing.
      - uses: taiki-e/install-action@82fc405565b9cf90abfe700ba43b4751ce2fe422
        with:
          tool: cargo-audit
      - name: advisories in the lock file
        run: cargo audit
