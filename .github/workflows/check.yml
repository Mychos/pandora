# The crate is the only thing this repository holds; the browser extension lives
# beside it and carries its own release steps.
#
# Three runners on purpose. Linux is where the suite and the lints run. Windows
# is the only place the named pipe in `src/shared/socket.rs` and the SSH agent that
# answers over it are ever executed — the crate cannot be cross-compiled here (the C
# dependencies want a mingw toolchain), so without this job the Windows half rots.
# macOS only typechecks: the suite stays on Linux, but its target-specific windowing
# and idle branches still have to be seen by rustc.
name: check

# Never on a push to a branch, and never on a timer: a pull request, a tag that is
# about to ship, and a hand-run are the three moments somebody is waiting on the answer.
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Two runs of the same ref are one question, and the answer to the first costs minutes.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # `rust-toolchain.toml` pins the compiler every build uses; the actions below name
  # the same one so a job never installs two of them.
  TOOLCHAIN: "1.99.0"
  # The fuzzers build the whole crate under AddressSanitizer, and rustc compiling
  # `ttf-parser` with those flags segfaults when several of them run at once. Two jobs
  # is slow and reliable; the default is fast and not.
  CARGO_BUILD_JOBS: "2"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # The action installs `rustup` and the compiler on any runner, whatever the image
      # already has; `rust-toolchain.toml` names the components, so this is the only
      # place that repeats the version.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      # The audio preview links against ALSA, and the windowing backends look
      # their libraries up through pkg-config.
      - name: system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev
      - name: format
        run: cargo fmt --check
      - name: lints
        run: cargo clippy --all-targets -- -D warnings
      # `probe_rows` is a debug probe and is `#[ignore]`d, so this is the whole
      # suite and nothing has to be skipped.
      - name: tests
        run: cargo test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # `rustup` itself: this runner handed the toolchain action an empty `toolchain`
      # input whatever the workflow said, and the file names the compiler anyway.
      - name: rust
        shell: bash
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: typecheck every target
        run: cargo check --all-targets
      # The pipe tests only: `check --all-targets` above already catches what rots on
      # this platform, and the suite itself runs on Linux, where it costs less. The
      # channel and the agent that speaks over it are the two things only a Windows
      # runner ever executes.
      - name: the channel over a named pipe
        run: cargo test --lib shared::socket
      - name: the SSH agent over a named pipe
        run: cargo test --lib agent

  # macOS only compiles here: the suite and the lints run on Linux, but this
  # is where the target-specific windowing and idle branches are seen by rustc.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: typecheck every target
        run: cargo check --all-targets
