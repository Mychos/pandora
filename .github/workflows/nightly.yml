# What does not answer to a diff: the parsers that take bytes from a stranger, and the
# advisories in the dependency tree. Both change with time — a corpus grows, an advisory
# is published — so they run on a schedule and on demand, never as a push gate.
#
# A failure here is a finding, so the job is red and its inputs are attached. The
# compiler the fuzzers use is pinned in `fuzz/rust-toolchain.toml`, the same way the
# crate pins its own: a bug in a nightly then reads as one, not as a flake.
name: nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Time per target, in seconds."
        required: false
        default: "120"

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FUZZ_SECONDS: ${{ github.event.inputs.seconds || '120' }}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Fuzzing needs nightly and `libfuzzer-sys` wants a C++ toolchain.
      # `fuzz/rust-toolchain.toml` names the nightly, and `rustup` reads it from there,
      # so the version is written down once.
      - name: rust
        working-directory: fuzz
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: taiki-e/install-action@82fc405565b9cf90abfe700ba43b4751ce2fe422
        with:
          tool: cargo-fuzz
      # The prebuilt binary is what usually lands; a run where the installer found
      # nothing to place leaves the subcommand missing, so it is built as a fallback.
      - name: cargo-fuzz
        run: cargo fuzz --version || cargo install cargo-fuzz --locked
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: fuzz
      # The box crate links ALSA and the windowing backends even under a fuzzer.
      - name: system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev
      # What every earlier run found. A miss is a first run and costs nothing.
      - name: inputs
        uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: fuzz every parser
        working-directory: fuzz
        run: |
          for target in codec csv import share; do
            cargo fuzz run "$target" -- -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=4096
          done
      # The corpus is small and the cache step above saves it on the way out; an
      # artifact keeps the inputs of a red run even when the cache does not land.
      - name: the inputs of this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: fuzz/corpus
          if-no-files-found: ignore
      - name: keep what it found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  # Nothing here reaches the network at runtime; this is about what the dependency tree
  # brings with it. A finding fails the job on purpose: the fix is a bump, or an
  # `audit.toml` entry that says why the advisory does not apply.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # A cargo subcommand still needs `cargo` beside it, and a container image is not a
      # runner that happens to have one preinstalled.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.0"
      # The prebuilt binary: building `cargo-audit` itself wants cmake and a C toolchain
      # for `aws-lc-sys`, which is minutes of CI for nothing.
      - uses: taiki-e/install-action@82fc405565b9cf90abfe700ba43b4751ce2fe422
        with:
          tool: cargo-audit
      - name: advisories in the lock file
        run: cargo audit
